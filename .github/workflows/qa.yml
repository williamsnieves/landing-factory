name: QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npx prettier --check .

      - name: Types and Astro diagnostics
        run: npm run check

      # The fixture tests launch Chromium, so install it before npm test.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit and fixture tests
        run: npm test

      - name: QA (build, screenshots, overflow, reduced motion, Lighthouse, impeccable)
        run: npm run qa

      # qa/latest is a symlink; upload-artifact does not follow it, so resolve it.
      - name: Resolve report directory
        if: always()
        id: report
        run: |
          if [ -e qa/latest ]; then
            echo "dir=$(readlink -f qa/latest)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload QA report and screenshots
        if: always() && steps.report.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: ${{ steps.report.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14
