name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npx prettier --check .

      - name: Types and Astro diagnostics
        run: npm run check

      - name: Validate pattern sheets
        run: npm run validate:patterns

      # The fixture tests launch Chromium, so install it before npm test.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit and fixture tests
        run: npm test

      - name: QA (build, screenshots, overflow, reduced motion, Lighthouse, impeccable)
        run: npm run qa

      # Only reached when every step above passed, so a failing QA never publishes dist/.
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # qa/latest is a symlink; upload-artifact does not follow it, so resolve it.
      - name: Resolve report directory
        if: always()
        id: report
        run: |
          if [ -e qa/latest ]; then
            echo "dir=$(readlink -f qa/latest)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload QA report and screenshots
        if: always() && steps.report.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: ${{ steps.report.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: qa
    if: needs.qa.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.output.outputs.url }}
      alias: ${{ steps.output.outputs.alias }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Production is the project's production branch (main); every other branch is a preview.
      BRANCH: ${{ github.head_ref || github.ref_name }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # Secret values are only tested for emptiness, never printed.
      - name: Check deploy prerequisites
        id: gate
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="${missing:+$missing, }CLOUDFLARE_ACCOUNT_ID"
          if [ "$IS_FORK" = "true" ]; then
            reason="Pull request from a fork: repository secrets are not available, so no preview is deployed."
          elif [ -n "$missing" ]; then
            reason="Missing GitHub secret(s): $missing. Add them under Settings > Secrets and variables > Actions (see README, Deployment)."
          else
            reason=""
          fi
          if [ -n "$reason" ]; then
            echo "::warning title=Deploy skipped::$reason"
            printf '### Deploy skipped\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci --ignore-scripts

      - name: Download built site
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Read Pages project from site.config.json
        if: steps.gate.outputs.enabled == 'true'
        id: config
        run: |
          echo "project=$(node -p "require('./site.config.json').cloudflare.pagesProject")" >> "$GITHUB_OUTPUT"
          echo "production_branch=$(node -p "require('./site.config.json').cloudflare.productionBranch")" >> "$GITHUB_OUTPUT"

      - name: Ensure the Pages project exists
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_PAGES_PROJECT: ${{ steps.config.outputs.project }}
          CF_PRODUCTION_BRANCH: ${{ steps.config.outputs.production_branch }}
        run: |
          npx wrangler pages project list --json 2>/dev/null > "$RUNNER_TEMP/projects.json"
          if node -e '
            const t = require("fs").readFileSync(process.argv[1], "utf8");
            const list = JSON.parse(t.slice(t.indexOf("[")));
            process.exit(list.some((p) => p["Project Name"] === process.argv[2]) ? 0 : 1);
          ' "$RUNNER_TEMP/projects.json" "$CF_PAGES_PROJECT"; then
            echo "Pages project $CF_PAGES_PROJECT already exists."
          else
            echo "Creating Pages project $CF_PAGES_PROJECT (production branch $CF_PRODUCTION_BRANCH)."
            npx wrangler pages project create "$CF_PAGES_PROJECT" --production-branch "$CF_PRODUCTION_BRANCH"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_PAGES_PROJECT: ${{ steps.config.outputs.project }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -o pipefail
          npx wrangler pages deploy dist \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$BRANCH" \
            --commit-hash "$COMMIT_SHA" \
            --commit-message "CI deploy of $COMMIT_SHA" \
            --commit-dirty=true 2>&1 | tee "$RUNNER_TEMP/wrangler-stdout.log"

      # wrangler writes ND-JSON (pages-deploy / pages-deploy-detailed) to WRANGLER_OUTPUT_FILE_PATH;
      # fall back to scanning stdout for *.pages.dev URLs.
      - name: Capture deployment URLs
        if: steps.gate.outputs.enabled == 'true'
        id: output
        run: |
          node scripts/parse-wrangler-output.mjs "$RUNNER_TEMP/wrangler-output.ndjson" "$RUNNER_TEMP/wrangler-stdout.log" > "$RUNNER_TEMP/urls.txt"
          cat "$RUNNER_TEMP/urls.txt" >> "$GITHUB_OUTPUT"
          url=$(sed -n 's/^url=//p' "$RUNNER_TEMP/urls.txt")
          alias=$(sed -n 's/^alias=//p' "$RUNNER_TEMP/urls.txt")
          if [ -z "$url" ]; then
            echo "::error::Deployment finished but no pages.dev URL was found in wrangler's output."
            exit 1
          fi
          {
            echo "### Cloudflare Pages deployment"
            echo ""
            echo "- Branch: \`$BRANCH\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Deployment URL: $url"
            [ -z "$alias" ] || echo "- Branch alias URL: $alias"
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, found by its hidden marker and updated on every push.
      - name: Comment preview URL on the pull request
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.output.outputs.url }}
          ALIAS_URL: ${{ steps.output.outputs.alias }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- landing-factory-preview -->';
            const { DEPLOY_URL, ALIAS_URL, COMMIT_SHA, RUN_URL } = process.env;
            const lines = [marker, '### Preview deployment', '', `- Preview: ${DEPLOY_URL}`];
            if (ALIAS_URL) lines.push(`- Branch alias: ${ALIAS_URL}`);
            lines.push(
              `- Commit: \`${COMMIT_SHA.slice(0, 7)}\``,
              `- [QA report artifact (\`qa-report\`) on this run](${RUN_URL})`,
            );
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
