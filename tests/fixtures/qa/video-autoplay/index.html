<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture video-autoplay</title>
    <meta
      name="description"
      content="QA fixture page: Fixture video-autoplay."
    />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #111;
        background: #fff;
      }
      figure {
        position: relative;
        margin: 0 0 40px;
      }
      img,
      video {
        display: block;
        width: 100%;
        height: auto;
      }
      video {
        position: absolute;
        inset: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main id="main">
      <h1>Fixture video-autoplay</h1>
      <figure data-video>
        <img
          alt=""
          width="640"
          height="360"
          src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27640%27 height=%27360%27%3E%3Crect width=%27640%27 height=%27360%27 fill=%27%23222%27/%3E%3C/svg%3E"
        />
        <video autoplay muted loop playsinline>
          <source src="clip.mp4" type="video/mp4" />
        </video>
      </figure>
    </main>
    <script>
      // Plays the clip whatever the visitor asked for: the bug the check exists for.
      document.querySelectorAll('video').forEach(function (v) {
        v.play().catch(function () {});
      });
    </script>
  </body>
</html>
